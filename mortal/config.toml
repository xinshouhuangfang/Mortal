# This is only an example. Most values are dummy placeholders just to match the
# types; they are often not optimal and must be tuned.

[control]
version = 4
online = true

state_file = 'mortal.pth'
best_state_file = 'best.pth'
tensorboard_dir = 'tensorboard'

device = 'auto'
enable_cudnn_benchmark = false
enable_amp = false
enable_compile = false

batch_size = 32
opt_step_every = 1

save_every = 32
test_every = 100000
submit_every = 400
old_update_every = 400
log_every = 50
train_epochs = 20

# using env `TRAIN_PLAY_PROFILE`
[train_play.default]
games = 800
log_dir = 'train_play_logs'
repeats = 1
explore_rate = 1.0

[test_play]
games = 1000
log_dir = 'test_play_logs'

[self_play]
games = 1024
log_dir = 'self_play_logs'
seed_key = -1

[dataset]
globs = [
#    '../logs/*.json.gz',
#    'play_human_logs/*.json.gz',
#    'train_logs/*.json.gz'
]
file_index = 'file_index.pth'
file_batch_size = 15
reserve_ratio = 0.0
num_workers = 1
player_names_files = ['player_names.txt']
num_epochs = 1
enable_augmentation = false
augmented_first = false

[resnet]
conv_channels = 32
num_blocks = 16

[env]
pts = [6.0, 4.0, 2.0, 0.0]

[policy]
awr_beta = 1.0
awr_clip = 100
entropy_weight = 1e-3
clip_ratio = 0.2
dual_clip = 3.0

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 0

[optim.scheduler]
peak = 1e-4
final = 1e-4
warm_up_steps = 0
max_steps = 0

[baseline.train]
device = 'auto'
enable_compile = false
state_file = 'baseline.pth'

[baseline.test]
device = 'auto'
enable_compile = false
state_file = 'baseline.pth'

[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = 'buffer'
drain_dir = 'drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[1v3]
seed_key = -1
games_per_iter = 100   
iters = 1
log_dir = '1v3_logs'

[1v3.challenger]
device = 'auto'
name = 'trainee'
state_file = 'mortal.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'auto'
name = 'baseline'
state_file = 'baseline.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[loop]
iterations = 0
selfplay_target = 2000
